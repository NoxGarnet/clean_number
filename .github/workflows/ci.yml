name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python:
    name: Windows Python 3.14
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js for syntax checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install core dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Record installed dependencies
        run: python -m pip list --format=freeze

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Check JavaScript syntax
        run: node --check ui/app.js

      - name: Check PowerShell syntax
        run: |
          foreach ($scriptName in @('Start-CleanNumber.ps1', 'Stop-CleanNumber.ps1')) {
            $parseTokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $scriptName), [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw ('PowerShell syntax check failed: ' + $scriptName)
            }
            Write-Output ($scriptName + ': syntax OK')
          }

      - name: Run complete synthetic regression suite
        run: python -B -m unittest discover -s tests -v

      - name: Run synthetic compression CLI
        run: >-
          python -B analyze.py
          --dir examples/synthetic/input/compression
          --config examples/synthetic/experiment.yaml
          --kind compression
          --output run-output/ci/compression
          --phase2-only

      - name: Run synthetic flexural CLI
        run: >-
          python -B analyze.py
          --dir examples/synthetic/input/flexural
          --config examples/synthetic/experiment.yaml
          --kind flexural
          --output run-output/ci/flexural
          --phase2-only

      - name: Check synthetic inputs remain unchanged
        run: git diff --exit-code -- examples/synthetic/input
