schema_version: 1
project:
  id: synthetic_demo
  name: Synthetic clean_number demonstration

factors:
  - name: treatment
    label: Treatment
    type: categorical

mixes:
  control:
    description: Synthetic control condition
  treated:
    description: Synthetic treated condition

condition_mapping:
  control:
    group_id: control
    mix_id: control
    factors:
      treatment: control
    label_cn: Synthetic control
    label_en: Synthetic control
  treated:
    group_id: treated
    mix_id: treated
    factors:
      treatment: treated
    label_cn: Synthetic treated
    label_en: Synthetic treated

display:
  x_axis_label: Strain (%) or displacement (mm)
  y_axis_label: Stress (MPa)

methods:
  compression:
    formula: peak_stress_chord_modulus
    required_columns:
      - stress_MPa
      - strain_pct
    modulus:
      lower_fraction: 0.10
      upper_fraction: 0.40
  flexural:
    formula: three_point_bending_rectangular
    required_columns:
      - force_kN
      - deform_mm
    geometry:
      span_mm: 100.0
      width_mm: 40.0
      depth_mm: 40.0
    modulus:
      lower_fraction: 0.10
      upper_fraction: 0.40

comparison:
  auto_discover: true
